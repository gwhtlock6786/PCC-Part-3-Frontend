<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>React Redux - Step 3</title>

    <style>
      /* =========================================================
       BASIC PAGE STYLING
       ========================================================= */

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;

        padding: 30px;

        font-family: Arial, sans-serif;

        background-color: #f4f4f4;

        color: #222;
      }

      .container {
        max-width: 900px;

        margin: 0 auto;
      }

      h1 {
        margin-top: 0;
      }

      .intro {
        line-height: 1.6;

        margin-bottom: 30px;
      }

      /* =========================================================
       EXERCISE CARD
       ========================================================= */

      .exercise {
        background-color: white;

        padding: 25px;

        margin-bottom: 20px;

        border-radius: 8px;

        border: 1px solid #ddd;
      }

      .exercise-number {
        font-size: 14px;

        font-weight: bold;

        color: #666;

        text-transform: uppercase;

        margin-bottom: 5px;
      }

      /* =========================================================
       REACT APPLICATION
       ========================================================= */

      #root {
        margin-top: 20px;
      }

      .state-card {
        padding: 20px;

        border: 1px solid #ccc;

        border-radius: 8px;

        background-color: #fafafa;
      }

      .state-display {
        padding: 20px;

        margin: 20px 0;

        background-color: #eee;

        border-radius: 5px;

        font-family: Consolas, monospace;

        font-size: 24px;

        text-align: center;
      }

      /* =========================================================
       BUTTONS
       ========================================================= */

      button {
        padding: 10px 16px;

        margin-right: 10px;

        border: none;

        border-radius: 5px;

        cursor: pointer;

        background-color: #333;

        color: white;

        font-size: 15px;
      }

      button:hover {
        background-color: #555;
      }

      /* =========================================================
       EXPLANATION
       ========================================================= */

      .explanation {
        margin-top: 20px;

        padding: 15px;

        background-color: #f5f5f5;

        border-left: 4px solid #333;

        line-height: 1.6;
      }

      code {
        font-family: Consolas, monospace;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <!-- =======================================================
         PAGE TITLE
         ======================================================= -->

      <h1>React Redux Practice</h1>

      <p class="intro">
        Step 3 moves the counter's state logic out of the React component and
        into Redux.
      </p>

      <!-- =======================================================
         STEP 3
         ======================================================= -->

      <div class="exercise">
        <div class="exercise-number">React Redux - Step 3</div>

        <h2>Extract State Logic to Redux</h2>

        <p>
          The counter state is now managed by Redux instead of React's
          <code>useState()</code>.
        </p>

        <!-- =====================================================
           REACT WILL RENDER HERE
           ===================================================== -->

        <div id="root"></div>
      </div>
    </div>

    <!-- =========================================================
       REACT
       ========================================================= -->

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>

    <!-- =========================================================
       REACT DOM
       ========================================================= -->

    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- =========================================================
       REDUX
       ========================================================= -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/redux/4.2.1/redux.min.js"></script>

    <!-- =========================================================
       REACT REDUX
       ========================================================= -->

    <script src="https://unpkg.com/react-redux@8.1.3/dist/react-redux.min.js"></script>

    <!-- =========================================================
       BABEL
       ========================================================= -->

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- =========================================================
       REDUX FILE
       ========================================================= -->

    <script src="redux.js"></script>

    <!-- =========================================================
       REACT FILE
       ========================================================= -->

    <script type="text/babel" src="./react-redux-step-3.jsx"></script>
  </body>
</html>
